[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs", "@simplewebauthn/server", "@simplewebauthn/browser", "basic-ftp"]
  included_files = ["netlify/functions/shared/**", "knowledge/**", "js/smile-charset.js", "js/smile-cp932-map.js", "js/smile-diary-html.js"]

# Japan 08:00 = UTC 23:00 previous day
[functions."line-send-morning"]
  schedule = "0 23 * * *"

[functions."api-diary-publish"]
  timeout = 26

# Evening task check (DISABLED until LINE_EVENING_TASKS_ENABLED=1)
# Japan 19:00 = UTC 10:00 — enable schedule only after morning is stable
# [functions."line-send-evening"]
#   schedule = "0 10 * * *"

# Pretty auth API paths → function router
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/api-auth/:splat"
  status = 200
  force = true

# GitHub Issues API (owner + CSRF; token server-side only)
[[redirects]]
  from = "/api/github-issues"
  to = "/.netlify/functions/api-github-issues"
  status = 200
  force = true

# Production diary publish (owner + CSRF; FTP secrets stay server-side)
[[redirects]]
  from = "/api/diary-publish"
  to = "/.netlify/functions/api-diary-publish"
  status = 200
  force = true

# Static security headers (CSP starts conservative for existing SPA)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://studio.egaonokiroku.co.jp https://*.netlify.app http://127.0.0.1:* http://localhost:*; font-src 'self' data:"

# Functions: do NOT set Access-Control-Allow-Origin=*
# CORS is applied per-request by shared/http.js (exact origin allowlist)
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
